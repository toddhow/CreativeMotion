name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows MSVC (Debug)", os: windows-2022, preset: debug, cc: cl, cxx: cl }
          - { name: "Windows MSVC (Release)", os: windows-2022, preset: release, cc: cl, cxx: cl }
          - { name: "Linux GCC (Debug)", os: ubuntu-24.04, preset: debug, cc: gcc, cxx: g++ }
          - { name: "Linux GCC (Release)", os: ubuntu-24.04, preset: release, cc: gcc, cxx: g++ }
          - { name: "Linux Clang (Debug)", os: ubuntu-24.04, preset: debug, cc: clang, cxx: clang++ }
          - { name: "Linux Clang (Release)", os: ubuntu-24.04, preset: release, cc: clang, cxx: clang++ }
          - { name: "Sanitizers (Linux Clang ASan+UBSan)", os: ubuntu-24.04, preset: asan, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: Format (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format (pinned, see .clang-format)
        run: pipx install clang-format==23.1.3
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' '*.h' | xargs --no-run-if-empty clang-format --dry-run --Werror

  lint:
    name: Lint (clang-tidy)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pipx install clang-tidy==22.1.8
      - name: Configure (produces compile_commands.json)
        run: cmake --preset debug
      - name: Run clang-tidy on our sources only
        run: |
          python3 tools/run_clang_tidy.py build/debug
