name: CI

# Every pull request runs all quality gates (see CLAUDE.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release]
        include:
          # Sanitizers gate: ASan + UBSan.
          - { compiler: clang, preset: asan }
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"; echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"; echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  windows:
    name: Windows MSVC (${{ matrix.preset }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
      # Same script developers run locally: loads MSVC via vswhere, builds, tests.
      - name: Build and test
        shell: pwsh
        run: ./tools/ci/windows-build.ps1 -Preset ${{ matrix.preset }}

  format:
    name: Format (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format (pinned, see .clang-format)
        run: pipx install clang-format==23.1.3
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' '*.h' | xargs --no-run-if-empty clang-format --dry-run --Werror

  lint:
    name: Lint (clang-tidy)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pipx install clang-tidy==22.1.8
      - name: Configure (produces compile_commands.json, fetches dependencies)
        run: cmake --preset debug
      - name: Run clang-tidy on our sources only
        run: python3 tools/run_clang_tidy.py build/debug

  jolt-includes:
    # Architecture rule: only physics/jolt/ may include Jolt headers. Also runs
    # as a ctest test in every build job; this job reports it on its own, fast.
    name: Jolt include check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -P tools/CheckJoltIncludes.cmake
