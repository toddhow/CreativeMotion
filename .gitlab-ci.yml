# GitLab CI: every merge request runs all quality gates (see CLAUDE.md).
# Runner tags are GitLab.com hosted runners:
#   https://docs.gitlab.com/ci/runners/hosted_runners/linux/
#   https://docs.gitlab.com/ci/runners/hosted_runners/windows/  (beta)

# Run for merge requests and for branch pushes, but not both for the same
# commit (GitLab's documented pattern for avoiding duplicate pipelines).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - build

# --- Linux ------------------------------------------------------------------

.linux:
  image: ubuntu:24.04
  tags: [saas-linux-medium-amd64]
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
        build-essential clang cmake ninja-build git ca-certificates python3 pipx

linux:
  extends: .linux
  stage: build
  parallel:
    matrix:
      - COMPILER: [gcc, clang]
        PRESET: [debug, release]
      # Sanitizers gate: ASan + UBSan.
      - COMPILER: [clang]
        PRESET: [asan]
  script:
    - |
      if [ "$COMPILER" = gcc ]; then export CC=gcc CXX=g++; else export CC=clang CXX=clang++; fi
    - cmake --preset "$PRESET"
    - cmake --build --preset "$PRESET"
    - ctest --preset "$PRESET"

format:
  image: python:3.12-slim
  tags: [saas-linux-small-amd64]
  stage: check
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    # Pinned, see .clang-format.
    - pip install --quiet clang-format==23.1.3
  script:
    - git ls-files '*.cpp' '*.hpp' '*.h' | xargs --no-run-if-empty clang-format --dry-run --Werror

lint:
  extends: .linux
  stage: check
  variables:
    CC: clang
    CXX: clang++
  script:
    - pipx install clang-tidy==22.1.8
    - export PATH="$HOME/.local/bin:$PATH"
    # Configure only: produces compile_commands.json and fetches dependencies.
    - cmake --preset debug
    - python3 tools/run_clang_tidy.py build/debug

# --- Windows ----------------------------------------------------------------
# Hosted Windows runners use PowerShell and cannot use `image`.

windows-msvc:
  tags: [saas-windows-medium-amd64]
  stage: build
  parallel:
    matrix:
      - PRESET: [debug, release]
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/windows-build.ps1 -Preset $env:PRESET
